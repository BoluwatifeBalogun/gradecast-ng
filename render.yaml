services:
  - type: web
    name: gradecast-ng
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 --timeout 180 run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Paste your PostgreSQL connection string in the Render dashboard.
      # Leave it empty to use a local SQLite file (wiped on the free plan).
      - key: DATABASE_URL
        sync: false
